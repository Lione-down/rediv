[alembic]
script_location = migrations
sqlalchemy.url = sqlite:///D:\works\codexWorks\project_revid\backend\test_alembic_fresh.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %-10s [%(name)s] %(message)s
datefmt = %H:%M:%S
